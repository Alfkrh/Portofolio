<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio pribadi Alif Fikri — mahasiswa Sistem Informasi yang berfokus pada UI/UX Design, Web Development, dan teknologi digital."
    />
    <meta name="author" content="Alif Fikri" />
    <meta name="theme-color" content="#2563EB" />
    <!-- Terapkan tema sebelum paint pertama supaya tidak ada kedipan mode.
         Nilai & aturannya sama dengan src/services/themeStore.ts. -->
    <script>
      ;(function () {
        try {
          var root = document.documentElement
          var pref = localStorage.getItem('portfolio-theme')
          var dark = pref === 'dark'
          if (pref !== 'light' && pref !== 'dark') {
            dark =
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
          }
          // Dark mode hanya untuk halaman publik; /admin tetap light.
          var isPublic =
            location.pathname !== '/admin' &&
            location.pathname.indexOf('/admin/') !== 0
          var on = Boolean(dark && isPublic)
          root.classList.toggle('dark', on)
          root.style.colorScheme = on ? 'dark' : 'light'
        } catch (e) {
          /* localStorage/media query tidak tersedia → biarkan default light */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Alif Fikri — Information Systems Student & Digital Creative</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
